    summary: MAS outsourcing and third-party service expectations apply to third-party AI.
    tags: [third-party]
  - id: 40
    anchored_to: "5.11"
    page: 22
    kind: guidance
    summary: "Example: deeper evaluation, testing and cyber checks when first deploying vendor-provided AI agents."
    tags: [third-party, agent]
  - id: 41
    anchored_to: "5.12"
    page: 22
    kind: definition
    summary: Models include specific ML/DL models or techniques such as optimisation or fine-tuning.
  - id: 42
    anchored_to: "5.12"
    page: 22
    kind: definition
    summary: Features are dataset attributes; feature engineering creates or transforms them.
  - id: 43
    anchored_to: "5.14"
    page: 23
    kind: reference
    summary: IMDA Starter Kit for Testing LLM-Based Applications for Safety and Reliability as a reference for GenAI assessment.
    tags: [genai, testing]
  - id: 44
    anchored_to: "5.14"
    page: 24
    kind: guidance
    summary: Regularisation limits parameters to reduce complexity.
  - id: 45
    anchored_to: "5.15"
    page: 24
    kind: guidance
    summary: Pilots or phased rollouts with guardrails can be used to obtain representative data when testing data is limited.
    tags: [guardrails, testing]
    treated_as_binding: true
  - id: 46
    anchored_to: "5.15"
    page: 24
    kind: expectation
    summary: >-
      GenAI testing must pay particular attention to hallucination, toxic/harmful/biased content,
      bias, data leakage or disclosure, and vulnerability to adversarial attack.
    tags: [genai, testing, guardrails, security]
    failure_modes:
      - hallucination
      - undesirable_content
      - bias
      - data_leakage
      - adversarial_vulnerability
  - id: 47
    anchored_to: "5.16"
    page: 24
    kind: reference
    summary: MAS Technology Risk Management Guidelines apply.
    tags: [security]
  - id: 48
    anchored_to: "5.20"
    page: 26
    kind: scope
    summary: Reviewers must be independent of both initial and ongoing deployment (operation) of the AI.
    tags: [pre-deployment-review]
  - id: 49
    anchored_to: "5.25"
    page: 28
    kind: guidance
    summary: "Change examples: training data, model/system architecture, key assumptions, scope of use, downstream impact."
    tags: [change-management]
    treated_as_binding: true
  - id: 50
    anchored_to: "6.3"
    page: 30
    kind: reference
