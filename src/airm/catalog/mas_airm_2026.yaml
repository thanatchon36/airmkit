    tags: [risk-appetite]
  - id: 19
    anchored_to: "3.5"
    page: 11
    kind: guidance
    summary: "Three lines of defence illustration: first line develops/uses and assesses; second line independently challenges and validates; internal audit assures framework effectiveness."
    tags: [governance]
  - id: 20
    anchored_to: "3.5"
    page: 11
    kind: definition
    summary: AI incident means an incident involving failure, malfunction or poor performance of the underlying AI system(s) or model(s).
    tags: [incident, definition]
  - id: 21
    anchored_to: "4.2"
    page: 13
    kind: scope
