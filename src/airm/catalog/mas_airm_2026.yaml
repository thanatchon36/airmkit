  - id: 35
    anchored_to: "5.7"
    page: 20
    kind: reference
    summary: FEAT principles as a reference for defining fair outcomes.
    tags: [fairness]
  - id: 36
    anchored_to: "5.8"
    page: 20
    kind: expectation
    summary: Proxies for, or attributes highly correlated with, protected attributes must also be considered.
    tags: [fairness]
  - id: 37
    anchored_to: "5.9"
    page: 20
    kind: scope
    summary: Human oversight expectations cover every case where the FI judged human involvement necessary, whether in-the-loop or over-the-loop.
    tags: [human-oversight]
  - id: 38
    anchored_to: "5.10"
    page: 21
    kind: scope
    summary: Development controls apply where the FI modifies or fine-tunes third-party AI before deployment.
    tags: [third-party]
  - id: 39
    anchored_to: "5.10"
    page: 21
