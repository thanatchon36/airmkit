    tags: [inventory]
  - id: 25
    anchored_to: "4.8"
    page: 15
    kind: guidance
    summary: "Agent inventory attributes: agent-specific identifiers, tools and systems the agent can access, its components, and the guardrails imposed."
    tags: [agent, inventory, guardrails]
    attributes:
      - agent_identifier
      - tools_and_systems_accessible
      - components
      - guardrails
    treated_as_binding: true
  - id: 26
    anchored_to: "4.10"
    page: 15
    kind: expectation
    summary: Dependencies between AI systems or models supporting a use case should be considered where they affect its risk profile.
    tags: [materiality, inventory]
  - id: 27
    anchored_to: "5.1"
    page: 17
    kind: definition
    summary: AI life cycle spans inception to retirement (adapted from ISO/IEC 22989).
  - id: 28
    anchored_to: "5.2"
    page: 17
    kind: expectation
    summary: >-
      Partial deployments (pilots, phased rollouts) need policies governing deviations from standard
      controls: time and user limits, success criteria, terms of use, close monitoring, scope compliance.
    tags: [lifecycle, guardrails, monitoring]
  - id: 29
    anchored_to: "5.3"
    page: 17
    kind: definition
    summary: Kill switches are mechanisms to deactivate AI expeditiously if it exceeds risk tolerances.
    tags: [kill-switch]
  - id: 30
    anchored_to: "5.4"
    page: 18
    kind: reference
    summary: PDPC advisory guidelines on personal data in AI recommendation/decision systems and in generative AI.
    tags: [privacy]
  - id: 31
    anchored_to: "5.5"
    page: 19
    kind: reference
    summary: NIST AI RMF transparency and explainability areas as a reference.
  - id: 32
    anchored_to: "5.5"
    page: 19
    kind: definition
    summary: Transparency is disclosure to affected individuals plus explanations on request; explainability is methods (built-in or post-hoc) for understanding outputs.
    tags: [transparency, explainability, definition]
  - id: 33
    anchored_to: "5.6"
    page: 19
    kind: guidance
    summary: Context includes how far AI decisions require explanation for end-users or customers.
  - id: 34
    anchored_to: "5.6"
    page: 19
    kind: guidance
