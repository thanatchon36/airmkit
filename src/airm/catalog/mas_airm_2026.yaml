    tags: [group, board]
  - id: 18
    anchored_to: "3.4"
    page: 10
    kind: guidance
    summary: >-
      Example risk appetite content: qualitative statements of accepted risk types and prohibited
      uses; quantitative measures such as incident counts/impact, material use cases on a single
