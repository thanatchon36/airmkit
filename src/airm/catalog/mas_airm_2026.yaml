    treated_as_binding: true
  - id: 22
    anchored_to: "4.4"
    page: 14
    kind: guidance
    summary: >-
      Shadow-AI mitigations: staff guidance on allowed/disallowed uses including embedded features
      and public tools, and technical controls such as network monitoring and data loss prevention
      to detect unauthorised AI use.
    tags: [shadow-ai, security]
    treated_as_binding: true
  - id: 23
    anchored_to: "4.6"
    page: 14
    kind: guidance
