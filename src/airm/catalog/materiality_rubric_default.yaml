# airmkit default risk materiality rubric for MAS-AIRM §4.10-§4.13.
#
# IMPORTANT: MAS does not prescribe how to score or combine Impact, Complexity and Reliance, nor
# what counts as "high" risk materiality (Response to Feedback §7.19). Every level, weight,
# threshold and credit below is this toolkit's PROPOSAL. Institutions should replace this file with
# their own rubric; the `derives_from` field on each signal records which paragraph the signal is
# an attempt to operationalise, so that substitutions can be argued paragraph by paragraph.
#
# A signal fires when its comparison matches the named field of the use case. The dimension's level
# is the highest level any fired signal raised. See src/airm/materiality.py for the comparisons.

id: default-v1
version: "1"
title: airmkit default MAS-AIRM risk materiality rubric
description: >-
  Operationalises the three dimensions MAS-AIRM §4.12 requires at minimum, using only fields the AI
  inventory already carries under §4.7 and §4.8 fn25. Combination is max-with-impact-gate: the tier
  is the highest dimension level, but Complexity and Reliance may raise it at most one level above
  Impact, implementing Response to Feedback §7.9 (Complexity is not standalone) and §7.5 (anchor on
  the consequences of failure).

combination: max_with_impact_gate
gate_headroom: 1

weights:
  impact: 0.5
  complexity: 0.2
  reliance: 0.3
weighted_bands: [0.5, 1.5, 2.5]

residual_floor: one_level

signals:
  # ---------------------------------------------------------------- Impact §4.12(a)
  impact:
    - id: IMP-DOMAIN-CRITICAL
      derives_from: "MAS-AIRM §4.12(a); §5.6; §5.7; §2.2 fn12; Response §7.18 (credit scoring illustration)"
      reason: >-
        use case is in a regulated domain and drives an outcome affecting customers, the FI's
        regulatory obligations or its financial position
      field: regulated_domain_exposure
      is_true: true
      level: critical
      weight: 1.0

    - id: IMP-DOMAIN-INTERNAL
      derives_from: "MAS-AIRM §4.12(a); §2.2 fn12 (low risk materiality assistive use)"
      reason: >-
        use case touches a regulated domain but only as internal, human-reviewed input, so a
        failure does not directly reach customers or regulatory outcomes
      field: regulated_domain_internal_only
      is_true: true
      level: medium
      weight: 0.4

    - id: IMP-AFFECTS-INDIVIDUALS
      derives_from: "MAS-AIRM §4.12(a) (impact on customers or other stakeholders)"
      reason: outputs affect customers or individuals
      field: affects_individuals
      is_true: true
      level: high
      weight: 1.0

    - id: IMP-PERSONAL-DATA
      derives_from: "MAS-AIRM §4.12(a) (nature and sensitivity of data processed); §5.4(f)"
      reason: processes personal data, which may be of a sensitive nature
      field: processes_personal_data
      is_true: true
      level: high
      weight: 0.8

    - id: IMP-DATA-CLASSIFICATION
      derives_from: "MAS-AIRM §4.12(a); §5.4(d) (data classification by criticality and sensitivity)"
      reason: processes data classified confidential or above
      field: data_classification
      in: [confidential, restricted, secret, highly_confidential]
      level: high
      weight: 0.8

    - id: IMP-EXTERNAL-ACTIONS
      derives_from: "MAS-AIRM §1.11 (agent executing unauthorised or erroneous actions); §4.12(a)"
      reason: agent can initiate actions on systems of record or third parties
      field: agent.can_initiate_external_actions
      is_true: true
      level: critical
      weight: 1.0

    - id: IMP-INTERNAL-ONLY
      derives_from: "MAS-AIRM §2.4; Response §7.18 (personal productivity illustration)"
      reason: internal, assistive use with no customer or stakeholder impact
      field: tags
      contains_any: [internal, productivity, assistive]
      level: low
      weight: 0.2

  # ------------------------------------------------------------ Complexity §4.12(b)
  complexity:
    - id: CPX-GENAI
      derives_from: "MAS-AIRM §4.12(b); §1.10; §5.13; Response §7.18 (third-party GenAI illustration)"
      reason: >-
        Generative AI, for which testing, monitoring and explanation approaches are still evolving
      field: is_generative
      is_true: true
      level: high
      weight: 1.0

    - id: CPX-AGENTIC
      derives_from: "MAS-AIRM §1.11; §4.12(b) (novelty of application); Response §12.4"
      reason: agentic system with autonomous decision-making, tool use and chained actions
      field: autonomy
      autonomy_at_least: autonomous_agent
      level: critical
      weight: 1.0

    - id: CPX-MULTI-AGENT
      derives_from: "MAS-AIRM §1.3 fn6 (multi-agent systems); Response §12.6"
      reason: multi-agent system, amplifying risk across chains of agents
      field: autonomy
      equals: multi_agent
      level: critical
      weight: 1.2

    - id: CPX-THIRD-PARTY-OPACITY
      derives_from: "MAS-AIRM §4.12(b) (third-party visibility); Response §7.11"
      reason: >-
        relies on third-party AI, limiting visibility into the design, training approach or data
      field: uses_third_party_ai
      is_true: true
      level: high
      weight: 0.8

    - id: CPX-EMBEDDED
      derives_from: "MAS-AIRM §4.2 fn21 (embedded AI in third-party services); §4.12(b)"
      reason: AI embedded in a service not marketed as AI, so the FI has least visibility
      field: has_embedded_ai
      is_true: true
      level: high
      weight: 0.8

    - id: CPX-AUTO-UPDATES
      derives_from: "MAS-AIRM §5.25(c) (dynamic updates); Response §10.67"
      reason: designed to update automatically, so behaviour may evolve without human involvement
      field: auto_updates
      is_true: true
      level: high
      weight: 0.8

    - id: CPX-CONVENTIONAL-INTERNAL
      derives_from: "Response §7.18 (internally developed regression-based illustration); MAS-AIRM §4.12(b)"
      reason: conventional, internally developed model whose methodology is well understood
      field: model_type
      in: [logistic_regression, linear_regression, decision_tree, scorecard, glm, regression]
      level: low
      weight: 0.2

    - id: CPX-NO-EXPLAINABILITY
      derives_from: "MAS-AIRM §4.12(b) (explainability of its outputs); §5.5-§5.6; §5.17(e)"
      reason: no documentation evidencing explainability analysis is linked in the inventory
      field: has_explainability_evidence
      is_false: true
      level: medium
      weight: 0.4

  # --------------------------------------------------------------- Reliance §4.12(c)
  reliance:
    - id: REL-AUTONOMOUS
      derives_from: "MAS-AIRM §4.12(c) (extent of autonomy granted); Response §7.18 (automated execution)"
      reason: decisions or actions are executed autonomously with limited review of each instance
      field: autonomy
      autonomy_at_least: autonomous_decisioning
      level: critical
      weight: 1.0

    - id: REL-HUMAN-OVER-LOOP
      derives_from: "MAS-AIRM §4.12(c) (degree of human involvement); §5.9 fn37 (over the loop)"
      reason: human oversight is over the loop, not on each decision
      field: autonomy
      equals: human_over_the_loop
      level: high
      weight: 0.8

    - id: REL-HUMAN-IN-LOOP
      derives_from: "MAS-AIRM §4.12(c); Response §7.18 (staff review each recommendation)"
      reason: a human reviews each output before it is acted on
      field: autonomy
      equals: human_in_the_loop
      level: medium
      weight: 0.4

    - id: REL-ASSISTIVE
      derives_from: "MAS-AIRM §2.4; §4.12(c)"
      reason: assistive only, with human review and correction before use
      field: autonomy
      equals: assistive
      level: low
      weight: 0.2

    - id: REL-NO-OVERSIGHT-RECORDED
      derives_from: "MAS-AIRM §5.9 (controls for appropriate human oversight); §4.12(c)"
      reason: no human oversight arrangement recorded in the inventory
      field: human_oversight
      empty: true
      level: high
      weight: 0.8

    - id: REL-THIRD-PARTY-DEPENDENCE
      derives_from: "MAS-AIRM §4.12(c) (extent of dependence on third-party providers); Response §7.13"
      reason: the decision or output depends on a third-party AI provider
      field: uses_third_party_ai
      is_true: true
      level: medium
      weight: 0.5

    - id: REL-NO-CONTINGENCY
      derives_from: "MAS-AIRM §5.3 (fallback options); Response §7.14"
      reason: no contingency plan or fallback recorded
      field: contingency_plan
      empty: true
      level: medium
      weight: 0.4

# Control credits that reduce the inherent tier to a residual tier (MAS-AIRM §4.11).
# MAS prescribes no residual methodology (Response §7.22). Default floor is one level: controls
# cannot take a Critical use case below High. This is the strict reading (docs/INTERPRETATIONS.md).
residual_credits:
  - id: RES-HUMAN-CHECKPOINT
    derives_from: "MAS-AIRM §5.9(c) (escalation when predefined conditions are met); Response §10.49-§10.50"
    reason: human checkpoints are defined for the agent's consequential steps
    field: agent.human_checkpoints
    nonempty: true
    credit: 0.5

  - id: RES-TESTED-GUARDRAILS
    derives_from: "MAS-AIRM §5.15 (effectiveness of associated guardrails tested)"
    reason: at least one guardrail has a recorded effectiveness test
    field: has_tested_guardrail
    is_true: true
    credit: 0.5

  - id: RES-INDEPENDENT-VALIDATION
    derives_from: "MAS-AIRM §5.19 (formal independent validation)"
    reason: model review status records a formal independent validation
    field: review_status
    equals: independent_validation
    credit: 0.5

  - id: RES-KILL-SWITCH
    derives_from: "MAS-AIRM §5.3 fn29; §5.23(b) (kill switches or override mechanisms)"
    reason: a kill switch or override mechanism exists
    field: kill_switch
    is_true: true
    credit: 0.5

  - id: RES-CONTINGENCY-PLAN
    derives_from: "MAS-AIRM §5.3 (tested fallback options)"
    reason: a contingency plan with fallback options is recorded
    field: contingency_plan
    nonempty: true
    credit: 0.5

  - id: RES-TRACE-LOGGING
    derives_from: "MAS-AIRM §5.23(a) and (d) (monitoring reasoning, actions, tools; enhanced logging)"
    reason: agent reasoning, actions and tool use are logged
    field: agent.trace_logging
    is_true: true
    credit: 0.5

  - id: RES-INDEPENDENT-VENDOR-ASSESSMENT
    derives_from: "MAS-AIRM §5.11(a) (independent certifications or external assessments, not self-attestations); Response §9.9"
    reason: third-party components carry an independent assessment rather than a self-attestation
    field: third_party
    nonempty: true
    credit: 0.25

citations:
  - "MAS-AIRM §4.10"
  - "MAS-AIRM §4.11"
  - "MAS-AIRM §4.12"
  - "MAS-AIRM §4.13"
