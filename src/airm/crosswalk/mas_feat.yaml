# Generated from a hand-authored mapping table; every row carries its justification.
# Mapping is interpretive: see docs/RESEARCH_QUESTIONS.md RQ4 threats to validity.
version: '1'
description: MAS-AIRM to the MAS FEAT Principles (2018), which MAS-AIRM 1.2 confirms continue to apply
  and 5.7 footnote 35 names as a reference for defining 'fair' outcomes. References are the FEAT principle
  numbers 1 to 14 with their grouping. FEAT is a principles document, so coverage is strongest on fairness
  and transparency and absent on lifecycle mechanics.
mappings:
- clause: '5.7'
  framework: mas_feat
  refs:
  - 'Fairness: Justifiability 1'
  - 'Fairness: Justifiability 2'
  coverage: full
  justification: FEAT principles 1 and 2 require that individuals or groups are not systematically disadvantaged
    through AIDA-driven decisions unless justified, and that use of personal attributes is justified.
  confidence: high
- clause: '5.8'
  framework: mas_feat
  refs:
  - 'Fairness: Accuracy and Bias 3'
  - 'Fairness: Accuracy and Bias 4'
  - 'Fairness: Justifiability 2'
  coverage: full
  justification: Principles 3 and 4 require data and models to be reviewed and validated to minimise
    unintentional bias and decisions reviewed so models behave as intended.
  confidence: high
- clause: '5.5'
  framework: mas_feat
  refs:
  - Transparency 12
  - Transparency 13
  - Transparency 14
  coverage: full
  justification: Principles 12 to 14 require proactive disclosure of AIDA use, and clear explanations
    on request of the data used, how it affects the decision, and the consequences.
  confidence: high
- clause: '5.6'
  framework: mas_feat
  refs:
