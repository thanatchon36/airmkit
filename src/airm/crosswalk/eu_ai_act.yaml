# Generated from a hand-authored mapping table; every row carries its justification.
# Mapping is interpretive: see docs/RESEARCH_QUESTIONS.md RQ4 threats to validity.
version: '1'
description: MAS-AIRM to Regulation (EU) 2024/1689 (Artificial Intelligence Act). References are Articles,
  Annexes and Recitals. The Act is binding law whose obligations attach to a system's risk classification
  and to the provider or deployer role, so an obligation may be 'full' in substance while applying only
  to Annex III high-risk systems. Credit scoring and life and health insurance pricing are Annex III
  high-risk uses, which is where the overlap with MAS-AIRM is strongest.
mappings:
- clause: '1.6'
  framework: eu_ai_act
  refs:
  - Art. 9(1)-(2)
  - Recital 65
  coverage: partial
  justification: The risk management system must be proportionate and iterative, but the Act's obligations
    attach to classification as high-risk, not to institution size.
  confidence: medium
  gap: Proportionality in the Act is risk-class based, not calibrated to the deployer's size and nature
    of activities.
- clause: '1.7'
  framework: eu_ai_act
  refs:
  - Art. 9(2)
  - Art. 72
  - Art. 17(1)(f)
  coverage: full
  justification: The risk management system is a continuous iterative process requiring regular systematic
    review, supported by post-market monitoring.
  confidence: high
- clause: '2.2'
  framework: eu_ai_act
  refs:
