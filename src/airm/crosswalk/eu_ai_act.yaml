  - Annex III
  - Art. 26
  - Art. 9
  - Art. 17
  coverage: partial
  justification: The Act has its own tiered regime with prohibited, high-risk, limited-risk and minimal-risk
    tiers.
  confidence: high
  gap: The Act's tiers are fixed by use category, not by the institution's assessment of material adverse
    impact; a use outside Annex III attracts almost no obligations.
