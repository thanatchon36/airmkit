  confidence: high
  gap: ISO 42001 has no detailed security control set; the institution would need ISO 27001 for the
    MAS-AIRM 5.16 content.
- clause: '5.17'
  framework: iso_42001
  refs:
  - A.6.2.7
  - A.6.2.8
  - '7.5'
  - A.4.5
  coverage: full
  justification: A.6.2.7 requires AI system and data documentation and A.6.2.8 records of AI system
