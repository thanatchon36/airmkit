  confidence: high
- clause: '5.18'
  framework: iso_42001
  refs:
  - A.6.2.4
  - A.6.2.5
  coverage: partial
  justification: Verification and validation before release is required, as is deployment readiness.
  confidence: medium
  gap: ISO does not require the reviewer to be a party not involved in development, which is the substance
