- clause: '5.12'
  framework: iso_42001
  refs:
  - A.6.1.2
  - A.6.2.3
  - A.6.2.4
  coverage: full
  justification: A.6.2.3 requires requirements and specification for AI systems and A.6.1.2 processes
    for responsible design, which is where selection sits.
  confidence: medium
- clause: '5.13'
  framework: iso_42001
  refs:
  - A.6.1.2
  - A.6.2.3
  - 6.1.2
  coverage: partial
  justification: Risk assessment would surface hallucination and opacity risks of newer models.
  confidence: low
  gap: No explicit expectation to weigh the benefits of newer, less-understood models against heightened
    risk and the FI's own capability to mitigate.
- clause: '5.14'
  framework: iso_42001
  refs:
  - A.6.2.4
  - A.6.2.5
  coverage: full
  justification: A.6.2.4 is verification and validation of AI systems, including acceptance criteria
