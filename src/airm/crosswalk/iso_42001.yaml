  confidence: medium
  gap: No requirement to define what the organisation considers 'fair', which MAS-AIRM 5.7 makes explicit.
- clause: '5.8'
  framework: iso_42001
  refs:
  - A.5.4
  - A.6.2.4
  coverage: partial
  justification: Impact assessment and verification and validation of AI systems would encompass bias
    testing.
  confidence: medium
  gap: No requirement to define protected attributes and their proxies, or to use fairness metrics and
    document mitigation.
- clause: '5.9'
  framework: iso_42001
  refs:
  - A.9.2
  - A.9.3
  - A.6.2.6
  coverage: partial
  justification: A.9 covers responsible use including human oversight of AI systems in use.
  confidence: medium
  gap: No treatment of automation bias and decision fatigue, and no requirement to review oversight
    interventions and near misses for effectiveness.
- clause: '5.10'
  framework: iso_42001
  refs:
  - A.10.2
  - A.10.3
  - A.10.4
  - A.6.2.4
  coverage: partial
  justification: A.10 covers third-party and customer relationships, allocating responsibilities along
    the AI value chain, with verification and validation applying to acquired systems.
  confidence: medium
  gap: No requirement to test third-party AI in the FI's own use-case context with its own data, nor
    compensatory testing for disclosure gaps.
- clause: '5.11'
  framework: iso_42001
  refs:
  - A.10.2
  - A.10.3
  - A.10.4
  coverage: partial
  justification: A.10.2 requires processes for allocating responsibilities with suppliers and assessing
    them.
  confidence: medium
  gap: ISO does not reject vendor self-attestation, does not address concentration risk, and has no
