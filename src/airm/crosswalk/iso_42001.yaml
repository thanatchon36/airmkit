  confidence: high
- clause: '5.15'
  framework: iso_42001
  refs:
  - A.6.2.4
  - A.6.2.5
  - 6.1.3
  coverage: partial
  justification: Verification and validation plus risk treatment cover putting controls in place before
    deployment.
  confidence: medium
  gap: No requirement to test the effectiveness of guardrails, and no named Generative AI failure modes.
- clause: '5.16'
  framework: iso_42001
  refs:
  - A.6.2.6
  - A.4.3
  - A.4.4
  coverage: partial
  justification: A.4 covers computing, data and system resources and A.6.2.6 deployment, but ISO 42001
