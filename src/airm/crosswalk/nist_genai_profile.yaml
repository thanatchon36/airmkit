  framework: nist_genai_profile
  refs:
  - GV-1.2-001
  - GV-4.3-001
  - MG-4.1-001
  coverage: partial
  justification: The Profile requires GenAI risk documentation and policies to be reviewed as the technology
    and its risks evolve.
  confidence: medium
  gap: No equivalent of MAS-AIRM's expectation that the FI review its whole AI risk management framework,
    not only its GenAI practices.
