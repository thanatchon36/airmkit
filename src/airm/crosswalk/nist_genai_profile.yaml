# Generated from a hand-authored mapping table; every row carries its justification.
# Scoped to generative AI by design: see the description field.
version: '1'
description: MAS-AIRM to the NIST AI RMF Generative AI Profile (NIST AI 600-1, July 2024). References
  are the Profile's suggested-action identifiers, which carry the function and subcategory of the parent
  NIST AI RMF (for example 'MS-2.11-001' is a Measure 2.11 action), together with its twelve GenAI risk
  categories where a whole category is the relevant unit. The Profile is scoped to generative AI, so
  it is silent by design on MAS-AIRM's general governance, identification, inventory and materiality
  machinery; a coverage of 'none' or 'partial' there reflects that scope rather than a defect. Mapped
  clauses are limited to those where generative AI is the subject, which is why this file has fewer
  rows than the others.
