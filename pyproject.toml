[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "airmkit"
version = "0.1.0"
description = "Operationalise the MAS Guidelines on AI Risk Management (2026) for LLM and agentic AI systems: inventory, materiality, controls, evidence and audit packs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thanatchon Chongmankhong" }]
keywords = ["ai-governance", "model-risk", "mas", "llm-evaluation", "agentic-ai", "compliance", "grc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
  "rich>=13.7",
]

[project.optional-dependencies]
evals = ["inspect-ai>=0.3.60", "deepeval>=2.0", "ragas>=0.2", "garak>=0.10"]
ollama = ["ollama>=0.4"]
api = ["httpx>=0.27"]
docs = ["mkdocs-material>=9.5", "mkdocs-include-markdown-plugin>=6.2"]
report = ["python-docx>=1.1"]
experiments = ["matplotlib>=3.9", "numpy>=2.0"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/airmkit"
Repository = "https://github.com/thanatchon36/airmkit"
Issues = "https://github.com/thanatchon36/airmkit/issues"
Documentation = "https://thanatchon36.github.io/airmkit/"

[project.scripts]
airm = "airm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/airm"]

[tool.hatch.build.targets.sdist]
include = ["src/airm", "tests", "schemas", "README.md", "LICENSE", "DISCLAIMER.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "D"]
# D401: properties and __len__ legitimately read as noun phrases ("Number of controls.").
# RUF001: the section sign and en dash are required to cite MAS paragraphs faithfully.
ignore = ["D203", "D213", "ANN401", "D107", "D401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on long clause texts and control ids; wrapping those strings makes the
# assertion harder to read than the line is long.
"tests/*" = ["D", "ANN", "S101", "E501", "SLF001"]
# The probe definitions are data: regular expressions and prompt text that wrapping would make
# harder to read and harder to compare against the published techniques they cite.
"src/airm/evals/probes.py" = ["E501"]
"experiments/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
files = ["src/airm"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "docx.*", "ollama.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests excluded from `make quick`",
  "ollama: requires a running Ollama instance",
]

[tool.coverage.run]
source = ["src/airm"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
