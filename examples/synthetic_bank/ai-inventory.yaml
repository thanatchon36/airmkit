- id: aml-alert-triage
  name: AML alert triage model
  purpose: Rank transaction monitoring alerts so that investigators work the highest-risk
    alerts first.
  business_function: Financial Crime Compliance
  approved_scope: Triage and prioritisation only; must not close or dismiss an alert
    autonomously.
  jurisdictions:
  - SG
  model_type: gradient_boosting
  data_used:
  - transaction_data_synth
  - alert_disposition_history_synth
  - customer_profile_synth
  data_classification: confidential
  processes_personal_data: true
  dependencies:
  - kind: system
    name: transaction_monitoring_system
    identifier: SYS-0088
    affects_risk_profile: true
  lifecycle_status: deployed
  risk_materiality_rating: Critical
  review_status: independent_validation
  roles:
  - role: owner
    party: Head of Financial Crime Compliance
    function: Compliance
  - role: developer
    party: Financial Crime Analytics
    function: Compliance
  - role: validator
    party: Model Validation unit
    function: Model Risk Management
  - role: monitor
    party: FCC Quality Assurance
    function: Compliance
  - role: accountable_person
    party: Head of Financial Crime Compliance
    function: Compliance
  documentation:
  - docs/mrm/aml-triage-model-card.md
  - docs/mrm/aml-triage-validation-report.md
  - docs/mrm/aml-triage-feature-importance.md
  third_party: []
  guardrails:
  - name: no autonomous closure
    kind: tool_allowlist
    description: The model can only reorder a queue; alert closure requires an investigator.
    tested: true
    evidence_ref: EV-AML-0007
  - name: minimum review rate
    kind: rate_limit
    description: At least 5% of low-ranked alerts are sampled and reviewed each month.
    tested: true
    evidence_ref: EV-AML-0008
  autonomy: human_over_the_loop
  human_oversight: Every alert is still dispositioned by an investigator; the model
    only orders the queue.
  affects_individuals: true
  contingency_plan: Revert to the rules-based alert ordering; investigators continue
    unaffected.
  kill_switch: true
  auto_updates: false
  tags:
  - aml
  - financial-crime
  last_reviewed: '2026-08-15'
