    affects_risk_profile: false
  lifecycle_status: deployed
  risk_materiality_rating: Critical
  review_status: independent_validation
  roles:
  - role: owner
    party: Head of Retail Credit Risk
    function: Retail Credit Risk
  - role: developer
    party: Credit Modelling team
    function: Data Science
  - role: validator
